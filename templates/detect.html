<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector - Cadence</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="wrap">
            <div class="logo">
                <div class="logo-mark">
                    <span></span><span></span><span></span><span></span>
                </div>
                Cadence
            </div>
            <div class="nav-links">
                <!-- THE FIX: Added data-page attributes so the CSS highlights the active tab -->
                <a href="/" data-page="index.html">Home</a>
                <a href="/about.html" data-page="about.html">About</a>
                <a href="/detect.html" class="nav-cta" data-page="detect.html">Try the Detector</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="wrap">
        <h1>Audio Deepfake Forensics</h1>
        <p>Upload a .wav file to analyze its authenticity and compression provenance.</p>

        <div class="grid-2" style="margin-top: 40px;">
            <!-- Upload Card -->
            <div class="card stack">
                <!-- THE FIX: Accessibility label attached to the input field -->
                <label for="audio-upload" class="eyebrow" style="margin-top: 0; cursor: pointer;">Audio Upload</label>
                <p style="font-size: 0.9rem;">Select a Sinhala or Tamil audio file for evaluation.</p>
                <input type="file" id="audio-upload" accept="audio/*, .wav, .mp3, .m4a, .ogg, .flac, .aac, .opus, .webm" style="margin: 20px 0; color: var(--ink-dim);">
                <button id="analyze-btn" class="btn btn-primary">Run Forensic Analysis</button>
                <div id="loading" style="display: none; margin-top: 15px; color: var(--warn); font-family: var(--font-mono); font-size: 0.85rem;">
                    Extracting spectrograms & analyzing...
                </div>
            </div>

            <!-- Results Card (Hidden by default) -->
            <div class="card stack" id="results-card" style="display: none;">
                <div class="eyebrow" style="margin-top: 0;">Detection Verdict</div>
                <h2 id="verdict-text" style="font-size: 2.5rem; margin-bottom: 10px;"></h2>

                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div class="pill"><span class="dot"></span><span id="confidence-text"></span></div>
                    <div class="pill"><span class="dot"></span><span id="compression-text"></span></div>
                </div>

                <div class="hairline" style="margin: 30px 0 20px;"></div>

                <div class="eyebrow">Explainability Heatmap</div>
                <img id="heatmap-img" src="" alt="Grad-CAM Heatmap" style="border-radius: var(--radius-sm); width: 100%; border: 1px solid var(--border);">

                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <div class="eyebrow">Plain-English Summary</div>
                    <p id="explanation-text" style="font-size: 0.92rem; line-height: 1.6; margin: 0;"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- THE FIX: Added app.js so your mobile navigation toggle actually functions on this page -->
    <script src="/static/app.js"></script>
    <script src="/static/detect.js"></script>
</body>
</html>
